<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" type="text/css" href="./chatOnly.css">
<!-- <link href='https://fonts.googleapis.com/css?family=Dekko' rel='stylesheet'> -->
<link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
<title>Some Title Here</title>
</head>
<body>
	<div class="background">
		<img alt="backgroundImage" id="bg" src="./background.jpg">
		<div class="border"></div>
	</div>
	<span id="dateTime">Date Time</span>
	<iframe id="iframeOverlay"></iframe>
	
	<script>
	function getById(id){
		return document.getElementById(id) || document.createElement("span");
	}
	
	window.onerror = function backupErr(errorMsg, url=false, lineNumber=false) {
		console.error(errorMsg);
		console.error(lineNumber);
		console.error("Unhandeled Error occured"); //or any message
		return false;
	};
	
	(function (w) {
		w.URLSearchParams = w.URLSearchParams || function (searchString) {
			let self = this;
			self.searchString = searchString;
			self.get = function (name) {
				const results = new RegExp('[\?&]' + name + '=([^&#]*)').exec(self.searchString);
				if (results == null) {
					return null;
				} else {
					return decodeURI(results[1]) || 0;
				}
			};
		};

	})(window);
	
	const urlParams = new URLSearchParams(window.location.search);
	
	let params = "";
	params += "&transparent&hidemenu";
	params += "&scale=0.4";
	params += "&fadein&smooth&emoji&color";
	params += "&twolines";

	// Pass showtime through to dock.html if provided
	if (urlParams.has("showtime")){
		params += "&showtime=" + urlParams.get("showtime");
	}
	var password = urlParams.get("password") || urlParams.get("pass") || urlParams.get("pw");
	if (password){
		params += "&password=" + encodeURIComponent(password);
	}
	["server", "server2", "server3", "localserver"].forEach(function(key){
		if (!urlParams.has(key)) return;
		var value = urlParams.get(key);
		params += value ? "&" + key + "=" + encodeURIComponent(value) : "&" + key;
	});

	// --- Common overlay tweaks (shared across themes) ---
	// hidebots is handled by the embedded dock.html, so pass it through
	if (urlParams.has("hidebots")){
		params += "&hidebots";
	}
	if (urlParams.has("chroma")){
		const _c = urlParams.get("chroma") || "";
		document.body.style.backgroundColor = _c.charAt(0) === "#" ? _c : "#" + _c;
	}
	if (urlParams.has("darkmode")){
		const _bg = document.getElementById("bg");
		if (_bg){ _bg.style.filter = "brightness(0.45) saturate(1.1)"; }
	}

	// Ported VERBATIM-faithful from featured.html's &css (~:1554) and
	// &b64css|base64css|cssbase64|cssb64 (~:1573-1590) blocks — same port
	// pattern as multi-alerts.js's applyCustomCss() (Alert Stage 1). See
	// theme-library-spec.md §A (Curated-8 css unlock). Applies to THIS
	// page's own head (chatOnly.html embeds dock.html in an iframe;
	// this is independent of the params it forwards to that iframe).
	if (urlParams.has("css")) {
		var _cssURL = urlParams.get("css");
		try { _cssURL = decodeURI(_cssURL); } catch (e) {}
		if (_cssURL.startsWith("http")) {
			var _cssLink = document.createElement("link");
			_cssLink.rel = "stylesheet";
			_cssLink.type = "text/css";
			_cssLink.media = "screen";
			_cssLink.href = _cssURL;
			document.getElementsByTagName("head")[0].appendChild(_cssLink);
		} else {
			var _cssStyle = document.createElement("style");
			_cssStyle.innerHTML = _cssURL;
			document.getElementsByTagName("head")[0].appendChild(_cssStyle);
		}
	}
	if (urlParams.has("base64css") || urlParams.has("b64css") || urlParams.has("cssbase64") || urlParams.has("cssb64")) {
		try {
			var _base64Css = urlParams.get("base64css") || urlParams.get("b64css") || urlParams.get("cssbase64") || urlParams.get("cssb64");
			try { _base64Css = atob(_base64Css); } catch (e) {}
			try { _base64Css = decodeURIComponent(_base64Css); } catch (e) {}
			var _b64Style = document.createElement("style");
			_b64Style.innerText = _base64Css;
			document.querySelector("head").appendChild(_b64Style);
		} catch (e) {
			console.error(e);
		}
	}

	if (urlParams.has("session")){
		getById("iframeOverlay").src = `../../dock.html?session=${urlParams.get("session")}${params}`;
	}

	setInterval(function updateTime() {
		const now = dayjs().format("A hh:mm:ss");
		getById("dateTime").innerText = now;
	}, 333);

	</script>
</body>
</html>
